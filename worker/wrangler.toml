name = "portfolio-gemini-worker"
main = "src/index.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
GEMINI_MODEL = "gemini-3.1-flash-lite"
PORTFOLIO_DATA_URL = "https://raw.githubusercontent.com/ayana0409/portfolio/main/src/data/portfolioData.json"
GITHUB_DOCS_BASE_URL = "https://raw.githubusercontent.com/ayana0409/portfolio/main"
MAX_REQUESTS_PER_MINUTE = "10"
MAX_TOKENS_PER_REQUEST = "200000"
